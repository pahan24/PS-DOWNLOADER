<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS Downloader — Debug Test</title>
<style>
body{font-family:monospace;background:#111;color:#eee;padding:20px;max-width:800px;margin:0 auto}
h2{color:#ff0000}
.ok{color:#00ff88}.err{color:#ff4444}.warn{color:#ffaa00}
button{background:#ff0000;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;margin:5px}
input{width:100%;padding:10px;background:#222;color:#fff;border:1px solid #444;border-radius:6px;font-size:14px;box-sizing:border-box;margin:5px 0}
pre{background:#1a1a1a;padding:12px;border-radius:6px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;font-size:12px;border:1px solid #333;max-height:300px;overflow-y:auto}
.section{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:16px;margin:12px 0}
</style>
</head>
<body>
<h2>🔴 PS Downloader — Live Debug</h2>

<div class="section">
<b>1. Clipboard Test</b><br><br>
<button onclick="testClipboard()">Test Paste/Clipboard</button>
<pre id="clipResult">Click button above...</pre>
</div>

<div class="section">
<b>2. API Status Test</b><br><br>
<button onclick="testStatus()">Test /api/status</button>
<pre id="statusResult">Click button above...</pre>
</div>

<div class="section">
<b>3. Download Info Test</b><br><br>
<input id="testUrl" placeholder="Paste YouTube/TikTok URL here" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
<button onclick="testInfo()">Test /api/info</button>
<pre id="infoResult">Click button above...</pre>
</div>

<div class="section">
<b>4. Download Link Test</b><br><br>
<button onclick="testDownload()" id="dlTestBtn">Test Download (runs after step 3)</button>
<pre id="dlResult">Run step 3 first...</pre>
</div>

<div class="section">
<b>5. All Logs</b>
<pre id="allLogs">Waiting for tests...</pre>
</div>

<script>
let lastFormats = [];
let lastUrl = '';

function log(msg, type) {
  const el = document.getElementById('allLogs');
  const ts = new Date().toTimeString().slice(0,8);
  const cls = type === 'ok' ? 'ok' : type === 'err' ? 'err' : 'warn';
  el.innerHTML += '<span class="' + cls + '">[' + ts + '] ' + msg + '</span>\n';
  el.scrollTop = el.scrollHeight;
  console.log('[DEBUG]', msg);
}

// 1. Clipboard
async function testClipboard() {
  const el = document.getElementById('clipResult');
  log('Testing clipboard...', 'warn');
  try {
    if (!navigator.clipboard) {
      el.innerHTML = '<span class="err">❌ navigator.clipboard NOT available (HTTP page or no permission)</span>';
      log('Clipboard API not available', 'err');
      return;
    }
    const text = await navigator.clipboard.readText();
    el.innerHTML = '<span class="ok">✅ Clipboard works!</span>\nContent: ' + text.slice(0,100);
    log('Clipboard OK: ' + text.slice(0,50), 'ok');
  } catch(e) {
    el.innerHTML = '<span class="err">❌ Clipboard error: ' + e.message + '</span>\n\nFix: Browser needs HTTPS + user permission.\nManual paste still works (click input + Ctrl+V)';
    log('Clipboard error: ' + e.message, 'err');
  }
}

// 2. API Status
async function testStatus() {
  const el = document.getElementById('statusResult');
  log('Testing /api/status...', 'warn');
  el.textContent = 'Loading...';
  try {
    const r = await fetch('/api/status');
    log('Status HTTP: ' + r.status, r.ok ? 'ok' : 'err');
    const data = await r.json();
    if (data.ytdlp) {
      el.innerHTML = '<span class="ok">✅ API OK! yt-dlp version: ' + data.ytdlpVersion + '</span>\n\n' + JSON.stringify(data, null, 2);
      log('yt-dlp ready: v' + data.ytdlpVersion, 'ok');
    } else {
      el.innerHTML = '<span class="err">⚠️ API up but yt-dlp NOT ready yet</span>\nyt-dlpPath: ' + data.ytdlpPath + '\n\nWait 30 seconds and try again — yt-dlp is downloading.\n\n' + JSON.stringify(data, null, 2);
      log('yt-dlp NOT ready. Path: ' + data.ytdlpPath, 'err');
    }
  } catch(e) {
    el.innerHTML = '<span class="err">❌ API UNREACHABLE: ' + e.message + '</span>';
    log('API unreachable: ' + e.message, 'err');
  }
}

// 3. Info
async function testInfo() {
  const el = document.getElementById('infoResult');
  const url = document.getElementById('testUrl').value.trim();
  if (!url) { el.textContent = 'Enter a URL first'; return; }
  lastUrl = url;
  log('Testing /api/info for: ' + url.slice(0,60), 'warn');
  el.textContent = 'Fetching... (may take 10-30s first time)';
  try {
    const r = await fetch('/api/info', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({url})
    });
    log('Info HTTP: ' + r.status, r.ok ? 'ok' : 'err');
    let data;
    try { data = await r.json(); } catch(je) {
      el.innerHTML = '<span class="err">❌ JSON parse error: ' + je.message + '</span>';
      log('JSON parse failed', 'err'); return;
    }
    if (data.success) {
      lastFormats = data.media.formats;
      el.innerHTML = '<span class="ok">✅ SUCCESS!</span>\n' +
        'Title: ' + data.media.title + '\n' +
        'Duration: ' + data.media.duration + '\n' +
        'Formats: ' + data.media.formats.length + '\n\n' +
        data.media.formats.map(f => f.id + ' — ' + f.label).join('\n');
      log('Info OK: ' + data.media.title + ' (' + lastFormats.length + ' formats)', 'ok');
    } else {
      el.innerHTML = '<span class="err">❌ Error: ' + data.error + '</span>';
      log('Info error: ' + data.error, 'err');
    }
  } catch(e) {
    el.innerHTML = '<span class="err">❌ Fetch failed: ' + e.message + '</span>';
    log('Fetch failed: ' + e.message, 'err');
  }
}

// 4. Download
async function testDownload() {
  const el = document.getElementById('dlResult');
  if (!lastFormats.length) { el.textContent = 'Run step 3 first!'; return; }
  const fmt = lastFormats.find(f => f.id === 'mp4-360') || lastFormats[0];
  log('Testing /api/download: ' + fmt.id, 'warn');
  el.textContent = 'Getting download URL for: ' + fmt.label + '...';
  try {
    const r = await fetch('/api/download', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({url: lastUrl, formatId: fmt.id, type: fmt.type, ext: fmt.ext})
    });
    log('Download HTTP: ' + r.status, r.ok ? 'ok' : 'err');
    const data = await r.json();
    if (data.success) {
      el.innerHTML = '<span class="ok">✅ Got download URL!</span>\n\nURL (first 100 chars):\n' + data.downloadUrl.slice(0,100) + '...\n\n<a href="' + data.downloadUrl + '" target="_blank" style="color:#ff0000">Click here to download</a>';
      log('Download URL obtained! Length: ' + data.downloadUrl.length, 'ok');
    } else {
      el.innerHTML = '<span class="err">❌ Error: ' + data.error + '</span>';
      log('Download error: ' + data.error, 'err');
    }
  } catch(e) {
    el.innerHTML = '<span class="err">❌ Fetch failed: ' + e.message + '</span>';
    log('Download fetch failed: ' + e.message, 'err');
  }
}

log('Debug page loaded. Run tests in order: 1 → 2 → 3 → 4', 'ok');
</script>
</body>
</html>
